<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AccessFlow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>AccessFlow</h2>
    <div class="sub">Inclusive-design overlay for <span class="pill">any website</span></div>

    <div class="grid">
      <!-- Inclusive Mode with controls -->
      <div class="mode-section">
        <button id="inclusive" class="primary">✅ Inclusive Mode<br><span class="pill">bigger text</span> <span class="pill">bigger buttons</span> <span class="pill">more whitespace</span></button>
        <div id="inclusive-controls" style="display:none;">
          <label for="font-size-slider">
            Font Size: <span id="font-size-value">18</span>px
          </label>
          <input
            type="range"
            id="font-size-slider"
            min="10"
            max="40"
            value="18"
            step="1"
          />
        </div>
      </div>

      <!-- Focus Mode with intensity controls -->
      <div class="mode-section">
        <button id="focus">🎯 Focus Mode<br><span class="pill">hide clutter</span> <span class="pill">highlight main</span></button>
        <div id="focus-controls" style="display:none;">
          <div class="intensity-selector">
            <button class="intensity-btn" data-level="light">Light</button>
            <button class="intensity-btn active" data-level="medium">Medium</button>
            <button class="intensity-btn" data-level="aggressive">Aggressive</button>
          </div>
        </div>
      </div>

      <button id="tunnel">🧭 Task Tunnel<br><span class="pill">step-by-step forms</span></button>
      <button id="simplify">🧠 Simplify Page<br><span class="pill">AI-powered</span> <span class="pill">adaptive</span></button>
      <button id="reset" class="danger">↩ Reset Page</button>
      <button id="reset-defaults">⚙️ Reset to Defaults</button>
    </div>

    <hr/>

    <!-- Content Description & Narration (GPT-4o-mini) -->
    <div class="grid">
      <button id="describe-images">👁 Describe Images</button>
      <button id="narrate-page">📖 Read Page</button>
    </div>
    <div id="narration-panel" style="display:none; margin-top:8px;">
      <div id="topic-chips"></div>
      <div id="narration-actions">
        <button id="read-all" class="primary">📖 Read Everything</button>
        <button id="narration-done" class="danger">✕ Done</button>
      </div>
    </div>
    <div id="image-description-controls" style="display:none; margin-top:8px;">
      <button id="next-image" class="primary">⏭ Next Image</button>
      <button id="stop-image-description" class="danger">🛑 Stop</button>
    </div>

    <hr/>

    <!-- Finger Tracking -->
    <div class="grid">
      <button id="finger-tracking">👆 Finger Tracking<br><span class="pill">hand gestures</span></button>
    </div>

    <hr/>

    <div class="row">
      <input id="cmd" placeholder='Try: "highlight search" or "click login"' />
      <button id="mic" title="Voice input">🎤</button>
      <button id="send">Send</button>
    </div>
    <div id="voice-status" style="font-size:11px; color:#666; margin-top:4px; min-height:16px;"></div>
    <div id="log" style="margin-top:10px;"></div>

    <script src="sidepanel.js"></script>
  </body>
</html>
