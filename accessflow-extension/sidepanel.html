<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AccessFlow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <h2>AccessFlow</h2>
    <div class="sub">AI-powered accessibility for <span class="pill">any website</span></div>

    <div id="suggestions-banner" style="display:none;"></div>

    <!-- Voice Command Input (TOP - Most Important) -->
    <div class="section">
      <h3>🎤 Voice Commands</h3>
      <div class="row">
        <input id="cmd" placeholder='Say "search for shoes" or "click login"' />
        <button id="mic" title="Voice input">🎤</button>
        <button id="send">Send</button>
      </div>
      <div id="voice-status" style="font-size:11px; color:#666; margin-top:4px; min-height:16px;"></div>
      <div id="log" style="margin-top:10px; font-size:12px;"></div>
    </div>

    <!-- Quick Actions (Main Modes) -->
    <div class="section">
      <h3>⚡ Quick Actions</h3>
      <div class="grid">
        <!-- Inclusive Mode -->
        <div class="mode-section">
          <button id="inclusive" class="primary">✅ Inclusive Mode</button>
          <div id="inclusive-controls" style="display:none; margin-top:8px;">
            <label for="font-size-slider" style="font-size:12px;">
              Font Size: <span id="font-size-value">18</span>px
            </label>
            <input
              type="range"
              id="font-size-slider"
              min="10"
              max="40"
              value="18"
              step="1"
              style="width:100%;"
            />
          </div>
        </div>

        <!-- Focus Mode -->
        <div class="mode-section">
          <button id="focus">🎯 Focus Mode</button>
          <div id="focus-controls" style="display:none; margin-top:8px;">
            <div class="intensity-selector">
              <button class="intensity-btn" data-level="light">Light</button>
              <button class="intensity-btn active" data-level="medium">Medium</button>
              <button class="intensity-btn" data-level="aggressive">Strong</button>
            </div>
          </div>
        </div>

        <!-- Color Blind Filter -->
        <div class="mode-section">
          <button id="colorblind">🎨 Color Blind Filter</button>
          <div id="colorblind-controls" style="display:none; margin-top:8px;">
            <div class="cb-filter-selector">
              <button class="cb-filter-btn active" data-filter="deuteranopia">Deuteranopia</button>
              <button class="cb-filter-btn" data-filter="protanopia">Protanopia</button>
              <button class="cb-filter-btn" data-filter="tritanopia">Tritanopia</button>
            </div>
            <div class="cb-mode-toggle" style="margin-top:6px;">
              <button class="cb-mode-btn active" data-mode="correct">Correct</button>
              <button class="cb-mode-btn" data-mode="simulate">Simulate</button>
            </div>
          </div>
        </div>

        <!-- Dyslexia Mode -->
        <div class="mode-section">
          <button id="dyslexia">🔤 Dyslexia Mode</button>
          <div id="dyslexia-controls" style="display:none; margin-top:8px;">
            <div class="dyslexia-feature-selector">
              <button class="dyslexia-feat-btn active" data-feature="font">Font</button>
              <button class="dyslexia-feat-btn" data-feature="ruler">Ruler</button>
              <button class="dyslexia-feat-btn" data-feature="overlay">Overlay</button>
              <button class="dyslexia-feat-btn" data-feature="bionic">Bionic</button>
            </div>
            <div id="dyslexia-overlay-colors" style="display:none; margin-top:6px;">
              <button class="dyslexia-color-btn active" data-color="yellow">Yellow</button>
              <button class="dyslexia-color-btn" data-color="blue">Blue</button>
              <button class="dyslexia-color-btn" data-color="pink">Pink</button>
              <button class="dyslexia-color-btn" data-color="green">Green</button>
            </div>
          </div>
        </div>

        <button id="simplify">🧠 Simplify Page</button>
        <button id="reset" class="danger">↩ Reset Page</button>
      </div>
    </div>

    <!-- Accessibility Tools -->
    <div class="section">
      <h3>🔧 Accessibility Tools</h3>

      <!-- Read Page Section -->
      <div class="tool-section">
        <button id="narrate-page">📖 Read Page</button>
        <!-- Narration Panel (Hidden by default) -->
        <div id="narration-panel" style="display:none; margin-top:12px;">
          <div id="topic-chips" style="margin-bottom:8px;"></div>
          <div id="narration-actions">
            <button id="read-all" class="primary">📖 Read Everything</button>
            <button id="narration-done" class="danger">✕ Done</button>
          </div>
        </div>
      </div>

      <!-- Describe Images Section -->
      <div class="tool-section" style="margin-top:8px;">
        <button id="describe-images">👁 Describe Images</button>
        <!-- Image Description Controls (Hidden by default) -->
        <div id="image-description-controls" style="display:none; margin-top:12px;">
          <button id="next-image" class="primary">⏭ Next Image</button>
          <button id="stop-image-description" class="danger">🛑 Stop</button>
        </div>
      </div>

      <!-- Other Tools -->
      <div class="grid" style="margin-top:8px;">
        <button id="finger-tracking">👆 Finger Tracking</button>
        <button id="tunnel">🧭 Task Tunnel</button>
      </div>
    </div>

    <!-- Accessibility Score -->
    <div class="section">
      <h3>📊 Accessibility Score</h3>
      <div id="score-panel">
        <div id="score-summary" style="display:none;">
          <div id="score-ring-container">
            <svg id="score-ring" viewBox="0 0 120 120" width="120" height="120">
              <circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="10"/>
              <circle id="score-ring-progress" cx="60" cy="60" r="52" fill="none" stroke="#10b981" stroke-width="10"
                stroke-dasharray="326.73" stroke-dashoffset="326.73" stroke-linecap="round"
                transform="rotate(-90 60 60)" style="transition: stroke-dashoffset 1s ease, stroke 0.3s ease;"/>
              <text id="score-ring-value" x="60" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">--</text>
              <text id="score-ring-grade" x="60" y="75" text-anchor="middle" font-size="16" font-weight="600" fill="#64748b">-</text>
            </svg>
          </div>
          <div id="score-scan-info" style="font-size:11px; color:#64748b; text-align:center; margin-top:4px;"></div>
          <div id="score-categories" style="margin-top:12px;"></div>
          <div id="score-comparison" style="display:none; margin-top:12px;"></div>
          <div id="score-issues" style="margin-top:12px;"></div>
        </div>
        <div id="score-actions" style="margin-top:10px;">
          <button id="run-scan" class="primary" style="width:100%;">🔍 Scan Page</button>
          <div id="score-action-buttons" style="display:none; margin-top:8px;">
            <div style="display:flex; gap:8px;">
              <button id="rescan-page" style="flex:1;">🔄 Rescan</button>
              <button id="ai-summary-btn" style="flex:1;">🤖 AI Summary</button>
            </div>
            <button id="export-report" style="width:100%; margin-top:8px;">📋 Copy Report</button>
          </div>
        </div>
        <div id="ai-summary-panel" style="display:none; margin-top:12px; padding:12px; background:var(--soft); border-radius:8px; font-size:13px; line-height:1.6;"></div>
      </div>
    </div>

    <!-- Profile & Settings (Collapsible) -->
    <div class="section">
      <details>
        <summary style="cursor:pointer; font-weight:600; padding:8px 0;">
          ⚙️ Settings <span id="profile-status" class="pill" style="margin-left:8px;">No preferences saved</span>
        </summary>
        <div id="profile-settings" style="padding-top:12px;">
          <label class="profile-toggle">
            <input type="checkbox" id="pref-auto-listen" />
            <span>Auto-start voice input</span>
          </label>
          <label class="profile-toggle">
            <input type="checkbox" id="pref-auto-read" />
            <span>Auto-read pages aloud</span>
          </label>
          <div id="profile-active-modes" style="margin-top:8px;"></div>
          <button id="clear-profile" class="danger" style="margin-top:12px;">Clear Saved Preferences</button>
          <button id="reset-defaults" style="margin-top:8px;">⚙️ Reset to Defaults</button>
        </div>
      </details>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
